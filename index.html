<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPUI - WEB</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="gpui__container">

        <div id="leftPanel" class="left-panel">
            left
        </div>

        <div class="divider" id="divider"></div>

        <div class="right-panel">
            <div class="policy_name">
                Политика: 
            </div>

            <div class="right-panel__container">

                <div id="subLeftPanel" class="sub_left-panel">
                    Состояние политики
                    <ul class="policy_status">
                        <li>
                            <label>
                                <input type="radio" name="option" value="1"> Не сконфигурировано
                            </label>
                        </li>
                        <li>
                            <label>
                                <input type="radio" name="option" value="2"> Включено
                            </label>
                        </li>
                        <li>
                              <label>
                                <input type="radio" name="option" value="3"> Отключено
                            </label>
                        </li>
                    </ul>
                </div>

                <div class="sub_divider" id="suv_divider"></div>

                <div class="sub_right-panel">

                    <div class="supported-on">
                        <div class="supported-on__title">
                            Поддерживается на:
                        </div>    
                        <div class="supported-on__box">
                            <div class="supported-on__info" name="supported-on__info" rows="5">
                            Поддерживается Microsoft Windows 7 и более поздние версии Поддерживается Microsoft Windows 7 и более поздние версии Поддерживается Microsoft Windows 7 и более поздние версии
                            </div>
                        </div>
                    </div>

                    <div class="comment">
                        <div class="comment__box">
                            
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
    
</body>
</html>
